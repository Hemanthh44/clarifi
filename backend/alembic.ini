[alembic]
script_location = alembic
prepend_sys_path = .
# The real URL is injected at runtime from DATABASE_URL by alembic/env.py —
# this placeholder is only here so `alembic.ini` is valid on its own.
sqlalchemy.url = postgresql+psycopg://user:password@localhost:5432/clarifi

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
